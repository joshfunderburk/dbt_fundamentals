repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.0
    hooks:
      - id: sqlfluff-lint
        args: ['--dialect', 'snowflake']
        additional_dependencies: ['dbt-core', 'dbt-snowflake', 'sqlfluff-templater-dbt']
        files: ^models/.*\.sql$
      - id: sqlfluff-fix
        args: ['--dialect', 'snowflake']
        additional_dependencies: ['dbt-core', 'dbt-snowflake', 'sqlfluff-templater-dbt']
        files: ^models/.*\.sql$